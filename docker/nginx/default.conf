# ============================================================================
# REQUIREMENT 5: Load Distribution — Nginx as a Reverse Proxy + Load Balancer
# ============================================================================
#
# This configuration distributes incoming HTTP requests across 3 PHP-FPM
# backend servers using a WEIGHTED ROUND ROBIN strategy.
#
# How it works:
#   upstream eshop_backends {
#       server app1:9000 weight=3;  ← gets 3 out of every 6 requests (50%)
#       server app2:9000 weight=1;  ← gets 1 out of every 6 requests (16.7%)
#       server app3:9000 weight=2;  ← gets 2 out of every 6 requests (33.3%)
#   }
#
# Why Weighted Round Robin?
#   In a real deployment, servers might have different hardware specs:
#     - app1: 8 CPU cores, 16GB RAM → weight=3 (handles more traffic)
#     - app2: 2 CPU cores, 4GB RAM  → weight=1 (handles less traffic)
#     - app3: 4 CPU cores, 8GB RAM  → weight=2 (medium capacity)
#
# Alternative strategies (change by editing the upstream block):
#   - Round Robin (default): remove all weight= directives
#   - Least Connections: add `least_conn;` at the top of the upstream block
#   - IP Hash (sticky sessions): add `ip_hash;` at the top
#
# Synchronization point: Nginx handles the distribution atomically at the
# network level — no race condition between selecting and routing a request.
# ============================================================================

upstream eshop_backends {
    # Weighted Round Robin (Req 5)
    # Change to `least_conn;` for least-connections strategy
    server app1:9000 weight=3;
    server app2:9000 weight=1;
    server app3:9000 weight=2;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Custom header to identify which backend served the request (for monitoring)
    add_header X-Backend-Server $upstream_addr always;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Connection limits (Req 2: Resource Management at the Nginx level)
    # Limits per-IP concurrent connections to prevent abuse
    # limit_conn_zone $binary_remote_addr zone=addr:10m;
    # limit_conn addr 20;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass eshop_backends;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout configuration
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 60s;

        # Buffer configuration for large responses
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
